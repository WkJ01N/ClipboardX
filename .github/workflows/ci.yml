name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClipboardX.xcodeproj -scheme ClipboardX
      - name: Test
        run: >-
          xcodebuild test
          -project ClipboardX.xcodeproj
          -scheme ClipboardX
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
      - name: Release build
        run: ./scripts/build-release.sh
      - name: Validate release artifacts
        run: |
          pkgutil --payload-files dist/ClipboardX.pkg | grep -q '^./Applications/ClipboardX.app/'
          unzip -t dist/ClipboardX.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-2.1.2
          path: |
            dist/ClipboardX.pkg
            dist/ClipboardX.zip
            dist/SHA256SUMS.txt
