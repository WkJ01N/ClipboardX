name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClipboardX.xcodeproj -scheme ClipboardX
      - name: Test
        run: >-
          xcodebuild test
          -project ClipboardX.xcodeproj
          -scheme ClipboardX
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
      - name: Release build
        run: >-
          xcodebuild build
          -project ClipboardX.xcodeproj
          -scheme ClipboardX
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
